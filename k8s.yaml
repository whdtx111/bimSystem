apiVersion: apps/v1
kind: Deployment
metadata:
  name: sp-server
  namespace: devops
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: sp-server
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sp-server
      annotations:
        kubesphere.io/imagepullsecrets: '{"$REGISTRY/$DOCKERHUB_NAMESPACE/$APP_NAME:latest":"harbor-images"}'
    spec:
      containers:
        - env:
            - name: CACHE_IGNORE
              value: js|html
            - name: CACHE_PUBLIC_EXPIRATION
              value: 3d
          image: $REGISTRY/$DOCKERHUB_NAMESPACE/$APP_NAME:SNAPSHOT-$BRANCH_NAME-$BUILD_NUMBER
          imagePullPolicy: Always
          name: sp-server
          args: ["--spring.profiles.active=$env"]
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            limits:
              cpu: 8000m
              memory: 8000Mi
            requests:
              cpu: 2000m
              memory: 2000Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      imagePullSecrets:
        - name: harbor-images
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
