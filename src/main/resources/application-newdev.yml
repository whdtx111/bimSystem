# Minio配置
minio:
  config:
    #    endpoint: http://10.5.57.53:30203
    ip: 10.5.57.53 #ip地址
    port: 30203  #  端口号
    accessKey: openpitrixminioaccesskey #  账号
    secretKey: openpitrixminiosecretkey #  密码
    secure: false #如果是true，则用的是https而不是http,默认值是true
    bucketName: "stream-files-uploads"  # 桶的名字
    folderName: "uploads" #文件夹名
    downloadDir: "/uploads/streamFiles/"  #保存到本地的路径

